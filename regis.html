<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    

    <div>
        <h1>Registration Form</h1>

        <form>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   minlength="8" maxlength="20" required>
            <br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label for="file">Upload File:</label>
            <input type="file" id="file" name="file">
            <br><br>

            <label>Subjects:</label><br>

            <input type="checkbox" id="c" name="subjects" value="C++">
            <label for="c">C++</label><br>

            <input type="checkbox" id="html" name="subjects" value="HTML">
            <label for="html">HTML</label><br>

            <input type="checkbox" id="dsa" name="subjects" value="DSA">
            <label for="dsa">DSA</label><br>

            <input type="checkbox" id="ai" name="subjects" value="AI">
            <label for="ai">Artificial Intelligence</label>

            <br><br>

            <input type="submit" value="Register">

        </form>

        <br>
        <a href="http://127.0.0.1:5500/formm.html">Go to Login Page</a>
    </div>

</body>
</html>
